# app(waitress, 8787) 앞단. 밖으로 나가는 포트는 여기뿐이다.
#
# ProxyFix(x_for=1, x_proto=1, x_host=1)가 web/app.py에 걸려 있으므로 아래 세
# 헤더를 반드시 그대로 넘겨야 한다. 빠지면 Flask가 자기를 http로 착각해서
# SESSION_COOKIE_SECURE·OAuth 리다이렉트가 어긋난다.

upstream cgv_app {
    server app:8787;
}

server {
    listen 80;
    server_name _;

    # 프론트엔드 번들이 그대로 지나간다. 알림기라 업로드는 없다.
    client_max_body_size 1m;

    location / {
        proxy_pass http://cgv_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 즉석 조회(LOOKUP_TIMEOUT=90s)와 CGV 로그인(LOGIN_TIMEOUT=120s)은
        # 브라우저 워커 큐를 기다린다. 기본 60초로는 504가 먼저 뜬다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    150s;
        proxy_read_timeout    150s;

        proxy_buffering off;   # 로그 tail 응답이 통째로 고이지 않게
    }
}

