# CGV 예매 가능 날짜 알림기 — 최초 1회 시드 설정
#
# ⚠️ 이 파일은 이제 "처음 DB를 만들 때의 초기값"으로만 쓰입니다.
#    감시 대상과 설정의 진짜 출처는 Postgres이고, 웹 화면에서 바꿉니다.
#    이미 DB가 만들어진 뒤에는 여기를 고쳐도 반영되지 않습니다.
#
#    대시보드:  http://127.0.0.1:8787
#    설정 변경:  웹의 '설정' 탭  (또는 PATCH /api/settings)
#    대상 변경:  웹의 '감시 대상' 탭

# 확인 간격(초). 최솟값 3초 — CGV 쪽 부담을 고려한 하한선입니다.
#
# 60의 약수(3·5·10·12·15·20·30·60)를 쓰면 확인 시각이 매분 같은 자리에 고정돼
# 간격이 밀리지 않습니다. 예매 오픈이 정각·30분에 몰리므로 이 위상 고정이
# 실제로 도움이 됩니다.
poll_interval_seconds = 30

# 알림에 상영관·상영시간 요약을 첨부할지. 끄면 새 날짜만 알립니다.
include_showtimes = true

# 오늘로부터 N일 이내에 열린 날짜만 알림. 0이면 제한 없음.
lookahead_days = 0

# 새 감시 대상을 추가할 때 폼에 미리 채워지는 상영관 필터입니다.
# 감시 대상별 필터는 각 대상에 따로 저장됩니다.
#   예: ["IMAX"] / ["IMAX", "4DX"] / ["SCREENX"]
# 부분 일치라 "IMAX"만 적어도 "IMAX LASER 2D"·"IMAX관"이 모두 걸립니다.
screen_types = ["SCREENX"]

# 브라우저를 화면 없이 실행. CGV가 headless를 막기 시작하면 false로 바꾸세요
# (창이 잠깐 떴다 사라지지만 동작은 동일합니다).
headless = true


# ── 감시 대상 ──────────────────────────────────────────────────────────────
# [[watch]] 블록은 `python3 watch.py --migrate`를 실행할 때만 읽힙니다.
# 이관이 끝났으므로 주석 처리해 두었습니다 — 대상은 웹에서 관리하세요.
# 남겨 두면 서버가 시작할 때 "무시된다"는 경고를 한 번 남깁니다.
#
# [[watch]]
# movie = "호프"
# sites = ["용산아이파크몰"]
# screen_types = ["SCREENX"]   # 대상별로 다르게 지정 (전역 설정을 덮음)
